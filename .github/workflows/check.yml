name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run eval

  # package.json 声明兼容到 DSH 0.1.7 线。那是一个"承诺"，这个作业负责让它保持为事实：
  # 把官方依赖切到该线后重跑同一套离线测试。
  check-legacy-0-1-7:
    name: check (DSH 0.1.7 line)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin official dependencies to the 0.1.7 line
        run: |
          node scripts/pin-legacy-deps.mjs 0.1.7-rc.2
          rm -f package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
